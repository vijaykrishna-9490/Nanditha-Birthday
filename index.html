<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Nanditha 💕</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.4)); }
            50% { filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.8)); }
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .animate-bounce {
            animation: bounce 2s infinite;
        }

        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .animate-fadeIn {
            animation: fadeIn 1s ease-in;
        }

        .animate-shake {
            animation: shake 0.5s;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;

        const BirthdayWebsite = () => {
            const [page, setPage] = useState('home');
            const [passcode, setPasscode] = useState('');
            const [showError, setShowError] = useState(false);
            const [countdown, setCountdown] = useState(5);
            const [selectedGift, setSelectedGift] = useState(null);
            const [selectedFlowers, setSelectedFlowers] = useState([]);

            useEffect(() => {
                if (page === 'countdown' && countdown > 0) {
                    const timer = setTimeout(() => setCountdown(countdown - 1), 1000);
                    return () => clearTimeout(timer);
                }
                if (countdown === 0) {
                    setTimeout(() => setPage('wish'), 1500);
                }
            }, [countdown, page]);

            const handlePasscodeSubmit = () => {
                if (passcode === '2508') {
                    setPage('image');
                    setShowError(false);
                } else {
                    setShowError(true);
                    setTimeout(() => setShowError(false), 2000);
                }
            };

            const flowers = [
                { name: 'Red Roses', color: '#D32F2F', emoji: '🌹' },
                { name: 'Pink Tulips', color: '#E91E63', emoji: '🌷' },
                { name: 'White Lilies', color: '#F5F5F5', emoji: '⚪' },
                { name: 'Sunflowers', color: '#FBC02D', emoji: '🌻' },
                { name: 'Purple Lavender', color: '#7C4DFF', emoji: '💜' },
                { name: 'Pink Peonies', color: '#FF69B4', emoji: '🌸' },
            ];

            const toggleFlower = (flowerName) => {
                if (selectedFlowers.includes(flowerName)) {
                    setSelectedFlowers(selectedFlowers.filter(f => f !== flowerName));
                } else {
                    setSelectedFlowers([...selectedFlowers, flowerName]);
                }
            };

            const Confetti = () => (
                <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', overflow: 'hidden' }}>
                    {[...Array(50)].map((_, i) => (
                        <div
                            key={i}
                            style={{
                                position: 'absolute',
                                left: Math.random() * 100 + '%',
                                top: -10 + 'px',
                                animation: `fall ${2 + Math.random() * 2}s linear forwards`,
                                fontSize: '20px',
                            }}
                        >
                            {['💝', '🎉', '✨', '🌸', '💕'][Math.floor(Math.random() * 5)]}
                        </div>
                    ))}
                </div>
            );

            const Floaters = () => (
                <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', overflow: 'hidden' }}>
                    {[...Array(20)].map((_, i) => (
                        <div
                            key={i}
                            style={{
                                position: 'absolute',
                                left: Math.random() * 100 + '%',
                                top: Math.random() * 100 + '%',
                                fontSize: '20px',
                                opacity: 0.3 + Math.random() * 0.4,
                                animation: `float ${4 + Math.random() * 3}s ease-in-out infinite`,
                            }}
                        >
                            {['⭐', '💕', '🎀', '💝', '✨'][Math.floor(Math.random() * 5)]}
                        </div>
                    ))}
                </div>
            );

            // HOME PAGE
            const HomePage = () => (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(to bottom, #fce7f3, #faf5ff, #fce7f3)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '1rem',
                    position: 'relative',
                    overflow: 'hidden'
                }}>
                    <Floaters />
                    
                    <div style={{ maxWidth: '28rem', width: '100%' }}>
                        <div style={{
                            textAlign: 'center',
                            marginBottom: '3rem',
                            animation: 'fadeIn 1s ease-in'
                        }}>
                            <h1 style={{
                                fontSize: '3rem',
                                fontWeight: 'bold',
                                color: '#ec4899',
                                marginBottom: '1rem',
                                textShadow: '2px 2px 4px rgba(0,0,0,0.1)'
                            }}>
                                🎉 Birthday Gift
                            </h1>
                            <p style={{
                                fontSize: '1.25rem',
                                color: '#9333ea',
                                marginBottom: '2rem',
                                fontWeight: '600'
                            }}>
                                For Nanditha
                            </p>
                        </div>

                        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '2rem' }}>
                            <div
                                onClick={() => setPage('passcode')}
                                style={{
                                    cursor: 'pointer',
                                    transform: 'scale(1)',
                                    transition: 'all 0.3s',
                                    animation: 'bounce 2s infinite, pulse-glow 2s ease-in-out infinite'
                                }}
                                onMouseEnter={(e) => e.currentTarget.style.transform = 'scale(1.1)'}
                                onMouseLeave={(e) => e.currentTarget.style.transform = 'scale(1)'}
                            >
                                <div style={{
                                    width: '12rem',
                                    height: '12rem',
                                    background: 'linear-gradient(to bottom right, #ef4444, #ec4899)',
                                    borderRadius: '0.5rem',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    fontSize: '4rem',
                                    boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1)',
                                    border: '4px solid #fbcfe8',
                                    transition: 'transform 0.3s'
                                }}>
                                    🎁
                                </div>
                            </div>
                        </div>

                        <div style={{ textAlign: 'center', color: '#4b5563', fontSize: '0.875rem' }}>
                            <p style={{ animation: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' }}>
                                ✨ Click the gift box to open it ✨
                            </p>
                        </div>
                    </div>
                </div>
            );

            // PASSCODE PAGE
            const PasscodePage = () => (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(to bottom, #f3e8ff, #fce7f3)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '1rem',
                    position: 'relative'
                }}>
                    <Floaters />
                    
                    <div style={{ maxWidth: '28rem', width: '100%' }}>
                        <div style={{
                            background: 'white',
                            borderRadius: '1.5rem',
                            boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1)',
                            padding: '2rem',
                            border: '4px solid #fbcfe8'
                        }}>
                            <h2 style={{
                                fontSize: '1.875rem',
                                fontWeight: 'bold',
                                textAlign: 'center',
                                color: '#ec4899',
                                marginBottom: '2rem'
                            }}>
                                🔐 Enter Passcode
                            </h2>

                            <div style={{ marginBottom: '1.5rem' }}>
                                <input
                                    type="password"
                                    value={passcode}
                                    onChange={(e) => setPasscode(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handlePasscodeSubmit()}
                                    placeholder="••••"
                                    style={{
                                        width: '100%',
                                        fontSize: '2.25rem',
                                        textAlign: 'center',
                                        padding: '1rem',
                                        border: '4px solid #fbcfe8',
                                        borderRadius: '1rem',
                                        outline: 'none',
                                        fontWeight: 'bold',
                                        transition: 'border-color 0.3s'
                                    }}
                                    onFocus={(e) => e.target.style.borderColor = '#a855f7'}
                                />
                            </div>

                            {showError && (
                                <div style={{
                                    background: '#fee2e2',
                                    border: '2px solid #ef4444',
                                    color: '#b91c1c',
                                    padding: '1rem',
                                    borderRadius: '0.5rem',
                                    marginBottom: '1.5rem',
                                    animation: 'shake 0.5s'
                                }}>
                                    ❌ Wrong passcode! Try again
                                </div>
                            )}

                            <button
                                onClick={handlePasscodeSubmit}
                                style={{
                                    width: '100%',
                                    background: 'linear-gradient(to right, #ec4899, #a855f7)',
                                    color: 'white',
                                    fontWeight: 'bold',
                                    padding: '1rem',
                                    borderRadius: '1rem',
                                    fontSize: '1.125rem',
                                    border: 'none',
                                    cursor: 'pointer',
                                    transition: 'all 0.3s',
                                    transform: 'scale(1)'
                                }}
                                onMouseEnter={(e) => {
                                    e.target.style.background = 'linear-gradient(to right, #db2777, #9333ea)';
                                    e.target.style.transform = 'scale(1.05)';
                                }}
                                onMouseLeave={(e) => {
                                    e.target.style.background = 'linear-gradient(to right, #ec4899, #a855f7)';
                                    e.target.style.transform = 'scale(1)';
                                }}
                            >
                                Unlock Gift 🔓
                            </button>

                            <p style={{
                                textAlign: 'center',
                                color: '#9ca3af',
                                fontSize: '0.875rem',
                                marginTop: '1.5rem'
                            }}>
                                💡 Hint: Think about something special...
                            </p>
                        </div>
                    </div>
                </div>
            );

            // IMAGE PAGE
            const ImagePage = () => (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(to bottom, #fce7f3, #faf5ff, #fce7f3)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '1rem',
                    position: 'relative'
                }}>
                    <Floaters />
                    
                    <div style={{ maxWidth: '28rem', width: '100%' }}>
                        <div style={{ textAlign: 'center', marginBottom: '3rem' }}>
                            <h2 style={{
                                fontSize: '1.875rem',
                                fontWeight: 'bold',
                                color: '#ec4899',
                                marginBottom: '2rem'
                            }}>
                                🌟 Tap the Image for a Surprise
                            </h2>
                        </div>

                        <div
                            onClick={() => setPage('countdown')}
                            style={{
                                cursor: 'pointer',
                                transform: 'scale(1)',
                                transition: 'all 0.3s'
                            }}
                            onMouseEnter={(e) => e.currentTarget.style.transform = 'scale(1.05)'}
                            onMouseLeave={(e) => e.currentTarget.style.transform = 'scale(1)'}
                        >
                            <div style={{
                                background: 'linear-gradient(to bottom right, #a78bfa, #f472b6, #f87171)',
                                borderRadius: '1.5rem',
                                padding: '0.5rem',
                                boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1)',
                                animation: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                            }}>
                                <div style={{
                                    background: 'white',
                                    borderRadius: '1.5rem',
                                    padding: '2rem',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    minHeight: '24rem'
                                }}>
                                    <div style={{ textAlign: 'center' }}>
                                        <div style={{ fontSize: '4rem', marginBottom: '1rem' }}>📸</div>
                                        <p style={{
                                            fontSize: '1.25rem',
                                            color: '#ec4899',
                                            fontWeight: '600'
                                        }}>
                                            Your Special Photo
                                        </p>
                                        <p style={{
                                            fontSize: '0.875rem',
                                            color: '#6b7280',
                                            marginTop: '1rem'
                                        }}>
                                            Tap to continue ✨
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // COUNTDOWN PAGE
            const CountdownPage = () => (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(to bottom, #e9d5ff, #fce7f3, #e9d5ff)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '1rem',
                    position: 'relative'
                }}>
                    <Floaters />
                    {countdown <= 2 && <Confetti />}
                    
                    <div style={{ maxWidth: '28rem', width: '100%', textAlign: 'center' }}>
                        <div style={{
                            fontSize: '5rem',
                            fontWeight: 'bold',
                            background: 'linear-gradient(to right, #ec4899, #a855f7)',
                            WebkitBackgroundClip: 'text',
                            WebkitTextFillColor: 'transparent',
                            marginBottom: '2rem',
                            animation: 'bounce 2s infinite'
                        }}>
                            {countdown > 0 ? countdown : '🎉'}
                        </div>
                        <p style={{
                            fontSize: '1.5rem',
                            color: '#9333ea',
                            fontWeight: '600'
                        }}>
                            {countdown > 0 ? 'Get Ready...' : 'Let\'s Celebrate! 🎊'}
                        </p>
                        
                        <div style={{
                            marginTop: '3rem',
                            display: 'flex',
                            gap: '1rem',
                            justifyContent: 'center',
                            fontSize: '2rem',
                            animation: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                        }}>
                            <span>🎈</span>
                            <span>🎁</span>
                            <span>🎉</span>
                            <span>🎀</span>
                            <span>💕</span>
                        </div>
                    </div>
                </div>
            );

            // WISH PAGE
            const WishPage = () => (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(to bottom, #fce7f3, #fef2f2, #fce7f3)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '1rem',
                    position: 'relative'
                }}>
                    <Floaters />
                    <Confetti />
                    
                    <div style={{ maxWidth: '28rem', width: '100%' }}>
                        <div style={{
                            background: 'white',
                            borderRadius: '1.5rem',
                            boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1)',
                            padding: '2rem',
                            border: '4px solid #fbcfe8',
                            textAlign: 'center'
                        }}>
                            <div style={{ fontSize: '3rem', marginBottom: '1.5rem' }}>🌟✨💕</div>
                            
                            <h1 style={{
                                fontSize: '2.25rem',
                                fontWeight: 'bold',
                                background: 'linear-gradient(to right, #ec4899, #dc2626)',
                                WebkitBackgroundClip: 'text',
                                WebkitTextFillColor: 'transparent',
                                marginBottom: '1rem',
                                animation: 'fadeIn 1s ease-in'
                            }}>
                                Happy Birthday!
                            </h1>
                            
                            <h2 style={{
                                fontSize: '3rem',
                                fontWeight: 'bold',
                                color: '#ec4899',
                                marginBottom: '2rem',
                                textShadow: '1px 1px 2px rgba(0,0,0,0.1)',
                                animation: 'fadeIn 1s ease-in'
                            }}>
                                Nanditha
                            </h2>

                            <p style={{
                                fontSize: '1.125rem',
                                color: '#374151',
                                marginBottom: '2rem',
                                lineHeight: '1.625',
                                fontWeight: '600'
                            }}>
                                You deserve all the happiness in the world! 🌈
                            </p>

                            <div style={{
                                display: 'flex',
                                justifyContent: 'center',
                                gap: '1rem',
                                fontSize: '2.25rem',
                                marginBottom: '2rem',
                                animation: 'bounce 2s infinite'
                            }}>
                                <span>🎂</span>
                                <span>🎀</span>
                                <span>🎉</span>
                            </div>

                            <button
                                onClick={() => setPage('giftQuestion')}
                                style={{
                                    width: '100%',
                                    background: 'linear-gradient(to right, #ec4899, #dc2626)',
                                    color: 'white',
                                    fontWeight: 'bold',
                                    padding: '1rem',
                                    borderRadius: '1rem',
                                    fontSize: '1.125rem',
                                    border: 'none',
                                    cursor: 'pointer',
                                    transition: 'all 0.3s',
                                    transform: 'scale(1)'
                                }}
                                onMouseEnter={(e) => {
                                    e.target.style.background = 'linear-gradient(to right, #db2777, #b91c1c)';
                                    e.target.style.transform = 'scale(1.05)';
                                }}
                                onMouseLeave={(e) => {
                                    e.target.style.background = 'linear-gradient(to right, #ec4899, #dc2626)';
                                    e.target.style.transform = 'scale(1)';
                                }}
                            >
                                Continue to Gift 💝
                            </button>
                        </div>
                    </div>
                </div>
            );

            // GIFT QUESTION PAGE
            const GiftQuestionPage = () => (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(to bottom, #fce7f3, #f3e8ff)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '1rem',
                    position: 'relative'
                }}>
                    <Floaters />
                    
                    <div style={{ maxWidth: '28rem', width: '100%' }}>
                        <div style={{
                            background: 'white',
                            borderRadius: '1.5rem',
                            boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1)',
                            padding: '2rem',
                            border: '4px solid #fbcfe8'
                        }}>
                            <div style={{ fontSize: '3rem', textAlign: 'center', marginBottom: '1.5rem' }}>💝</div>
                            
                            <h2 style={{
                                fontSize: '1.875rem',
                                fontWeight: 'bold',
                                textAlign: 'center',
                                color: '#ec4899',
                                marginBottom: '3rem'
                            }}>
                                Accept the Gift?
                            </h2>

                            <div style={{ display: 'flex', gap: '1rem' }}>
                                <button
                                    onClick={() => setPage('noMessage')}
                                    style={{
                                        flex: 1,
                                        background: '#d1d5db',
                                        color: '#1f2937',
                                        fontWeight: 'bold',
                                        padding: '1rem',
                                        borderRadius: '1rem',
                                        border: 'none',
                                        cursor: 'pointer',
                                        transition: 'all 0.3s',
                                        transform: 'scale(1)'
                                    }}
                                    onMouseEnter={(e) => {
                                        e.target.style.background = '#9ca3af';
                                        e.target.style.transform = 'scale(1.05)';
                                    }}
                                    onMouseLeave={(e) => {
                                        e.target.style.background = '#d1d5db';
                                        e.target.style.transform = 'scale(1)';
                                    }}
                                >
                                    No 😢
                                </button>
                                <button
                                    onClick={() => setPage('giftSelection')}
                                    style={{
                                        flex: 1,
                                        background: 'linear-gradient(to right, #ec4899, #a855f7)',
                                        color: 'white',
                                        fontWeight: 'bold',
                                        padding: '1rem',
                                        borderRadius: '1rem',
                                        border: 'none',
                                        cursor: 'pointer',
                                        transition: 'all 0.3s',
                                        transform: 'scale(1)'
                                    }}
                                    onMouseEnter={(e) => {
                                        e.target.style.background = 'linear-gradient(to right, #db2777, #9333ea)';
                                        e.target.style.transform = 'scale(1.05)';
                                    }}
                                    onMouseLeave={(e) => {
                                        e.target.style.background = 'linear-gradient(to right, #ec4899, #a855f7)';
                                        e.target.style.transform = 'scale(1)';
                                    }}
                                >
                                    Yes! 💕
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // NO MESSAGE PAGE
            const NoMessagePage = () => (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(to bottom, #e9d5ff, #fce7f3)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '1rem',
                    position: 'relative'
                }}>
                    <Floaters />
                    
                    <div style={{ maxWidth: '28rem', width: '100%' }}>
                        <div style={{
                            background: 'white',
                            borderRadius: '1.5rem',
                            boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.1)',
                            padding: '2rem',
                            border: '4px solid #d8b4fe',
                            textAlign: 'center'
                        }}>
                            <div style={{ fontSize: '4rem', marginBottom: '1.5rem' }}>🥺</div>
                            
                            <h2 style={{
                                fontSize: '1.875rem',
                                fontWeight: 'bold',
                                color: '#a855f7',
                                marginBottom: '2rem'
                            }}>
                                Why Did You Click No?
                            </h2>

                            <p style={{
                                fontSize: '1.125rem',
                                color: '#374151',
                                marginBottom: '2rem'
                            }}>
                                I worked so hard on this gift for you! Please give it a chance 💜
                            </p>

                            <button
                                onClick={() => setPage('giftSelection')}
                                style={{
                                    width: '100%',
                                    background: 'linear-gradient(to right, #a855f7, #ec4899)',
                                    color: 'white',
                                    fontWeight: 'bold',
                                    padding: '1rem',
                                    borderRadius: '1rem',
                                    border: 'none',
                                    cursor: 'pointer',
                                    marginBottom: '1rem',
                                    transition: 'all 0.3s',
                                    transform: 'scale(1)'
                                }}
                                onMouseEnter={(e) => {
                                    e.target.style.background = 'linear-gradient(to right, #9333ea, #db2777)';
                                    e.target.style.transform = 'scale(1.05)';
                                }}
                                onMouseLeave={(e) => {
                                    e.target.style.background = 'linear-gradient(to right, #a855f7, #ec4899)';
                                    e.target.style.transform = 'scale(1)';
                                }}
                            >
                                Open the Gift! 💝
                            </button>

                            <button
